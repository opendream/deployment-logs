services:
  app:
    build: .
    ports:
      - "${APP_PORT:-4900}:${PORT:-3000}"
    environment:
      DB_DRIVER: ${DB_DRIVER:-mssql}
      DB_HOST: ${DB_HOST:-mssql}
      DB_PORT: ${DB_PORT:-1433}
      DB_USER: ${DB_USER:-sa}
      DB_PASSWORD: ${DB_PASSWORD:-YourStrong!Passw0rd}
      DB_NAME: ${DB_NAME:-deployment_logs}
      DB_SCHEMA: ${DB_SCHEMA:-deploymentlogs}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin}
      JWT_SECRET: ${JWT_SECRET:-}
      PORT: ${PORT:-3000}
      REPOS_DIR: ${REPOS_DIR:-/data/repos}
      BASE_PATH: ${BASE_PATH:-}
    volumes:
      - app-data:/data
    depends_on:
      mssql:
        condition: service_healthy

  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${DB_PASSWORD:-YourStrong!Passw0rd}
    volumes:
      - mssql-data:/var/opt/mssql
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "${DB_PASSWORD:-YourStrong!Passw0rd}" -C -Q "SELECT 1" || exit 1
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  app-data:
  mssql-data:
